[package]
name = "xharness-model-catalog"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/123123213weqw/xharness-model-catalog"
description = "Offline, documented model reasoning controls and protocol-specific request mappings"
readme = "README.md"
include = ["src/**", "data/**", "tests/**", "README.md", "LICENSE", "Cargo.toml"]
keywords = ["llm", "reasoning", "deepseek", "glm", "catalog"]
categories = ["config"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
