[package]
name = "reasonmap"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/123123213weqw/reasonmap"
description = "Offline, documented model reasoning controls and protocol-specific request mappings"
readme = "README.md"
include = ["src/**", "data/**", "tests/**", "docs/**", "scripts/*.py", "CONTRIBUTING.md", "SECURITY.md", "AGENTS.md", "README.md", "LICENSE", "Cargo.toml"]
keywords = ["llm", "reasoning", "deepseek", "glm", "catalog"]
categories = ["config"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
